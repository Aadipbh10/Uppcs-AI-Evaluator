name: Prana Unified Access Patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/prana-unified-access-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'chore: apply unified access patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply incremental patch
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('main.py')
          s = p.read_text(encoding='utf-8')

          # 1) Unified Telegram direct-chat access gate.
          new_gate = r'''def telegram_chat_access_allowed(message):
    """Unified Telegram evaluation access gate.

    Mini App and direct Telegram chat use the same user/access model.
    Full/admin/super-admin users are full access; trial users get the
    same 3-copy / 10-question gate; authorized groups remain full access.
    """
    if not DB_ENABLED or SessionLocal is None:
        return False, "database_unavailable"

    uid = str(getattr(getattr(message, "from_user", None), "id", ""))
    if not uid:
        return False, "not_authorized"

    session = SessionLocal()
    try:
        user = session.get(DBUser, uid)
        if user and user.is_blocked:
            return False, "blocked"

        # Environment-configured Super Admin.
        if SUPER_ADMIN_TELEGRAM_ID and uid == SUPER_ADMIN_TELEGRAM_ID:
            if user:
                user.is_allowed = True
                user.access_type = "full"
                session.commit()
            return True, "full"

        # Admin-panel admins are always full evaluation users.
        is_admin = uid in ADMIN_TELEGRAM_IDS
        if not is_admin:
            try:
                row = session.execute(__import__("sqlalchemy").text(
                    "SELECT role FROM admin_users WHERE telegram_user_id=:uid AND is_active=TRUE LIMIT 1"
                ), {"uid": uid}).mappings().first()
                is_admin = bool(row and str(row.get("role", "")).lower() in ("admin", "super_admin"))
            except Exception:
                is_admin = False

        if is_admin:
            if user:
                user.is_allowed = True
                user.access_type = "full"
                session.commit()
            return True, "full"

        if user and (user.is_allowed or user.access_type == "full"):
            return True, "full"

        if user and user.access_type == "trial":
            if int(user.trial_copies_used or 0) >= int(user.trial_copies_limit or 3):
                return False, "trial_copies_exhausted"
            if int(user.trial_questions_used or 0) >= int(user.trial_questions_limit or 10):
                return False, "trial_questions_exhausted"
            return True, "trial"
    except Exception as e:
        print("TELEGRAM ACCESS DB ERROR:", e)
        session.rollback()
        return False, "database_error"
    finally:
        session.close()

    # Existing group access remains full evaluation access.
    if bot:
        session = SessionLocal()
        try:
            groups = session.query(DBGroup).filter(
                DBGroup.is_allowed == True,
                DBGroup.is_blocked == False
            ).all()
        except Exception as e:
            print("TELEGRAM GROUP ACCESS DB ERROR:", e)
            groups = []
        finally:
            session.close()

        for group in groups:
            try:
                member = bot.get_chat_member(int(group.telegram_group_id), int(uid))
                status = str(getattr(member, "status", ""))
                if status in ("creator", "administrator", "member"):
                    return True, "group"
            except Exception:
                continue

    return False, "not_authorized"
'''

          pattern = r'def telegram_chat_access_allowed\(message\):.*?(?=\n\nif bot:\n)'
          s2, n = re.subn(pattern, new_gate.rstrip(), s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('Could not locate telegram_chat_access_allowed block')
          s = s2

          # 2) Add newly-created admin to the same users table as full access.
          old = '''        now=_utcnow(); s.execute(__import__("sqlalchemy").text("INSERT INTO admin_users(telegram_user_id,role,is_active,created_at) VALUES (:uid,'admin',TRUE,:now) ON CONFLICT (telegram_user_id) DO UPDATE SET role='admin',is_active=TRUE"),{"uid":uid,"now":now}); s.commit(); return {"ok":True}'''
          new = '''        now=_utcnow()
        s.execute(__import__("sqlalchemy").text("INSERT INTO admin_users(telegram_user_id,role,is_active,created_at) VALUES (:uid,'admin',TRUE,:now) ON CONFLICT (telegram_user_id) DO UPDATE SET role='admin',is_active=TRUE"),{"uid":uid,"now":now})
        u=s.get(DBUser,uid)
        if u is None:
            u=DBUser(telegram_user_id=uid,is_allowed=True,is_blocked=False,access_type='full',created_at=now,last_seen_at=now)
            s.add(u)
        else:
            u.is_allowed=True; u.is_blocked=False; u.access_type='full'; u.last_seen_at=now
        s.commit(); return {"ok":True}'''
          if old not in s:
              raise SystemExit('Could not locate admin_add_admin write')
          s = s.replace(old, new, 1)

          # 3) Add direct-chat result/PDF/Mini App buttons after a successful evaluation.
          old_save = '''            save_evaluation_to_database(
                message,
                item,
                paper,
                result,
                evaluated_filename,
                final_pdf.getvalue()
            )'''
          new_save = '''            submission_id = save_evaluation_to_database(
                message,
                item,
                paper,
                result,
                evaluated_filename,
                final_pdf.getvalue()
            )

            reply_markup = None
            if submission_id:
                reply_markup = telebot.types.InlineKeyboardMarkup(row_width=2)
                reply_markup.add(
                    telebot.types.InlineKeyboardButton("📊 View Result", callback_data=f"prana_result:{submission_id}"),
                    telebot.types.InlineKeyboardButton("📄 Send PDF Again", callback_data=f"prana_pdf:{submission_id}"),
                )
                reply_markup.add(
                    telebot.types.InlineKeyboardButton("📱 Open Mini App", url=f"{PUBLIC_BASE_URL}/app"),
                    telebot.types.InlineKeyboardButton("📈 Performance", url=f"{PUBLIC_BASE_URL}/app"),
                )'''
          if old_save not in s:
              raise SystemExit('Could not locate evaluation DB save block')
          s = s.replace(old_save, new_save, 1)

          old_send = '''            bot.send_document(
                chat_id,
                final_pdf,
                visible_file_name=evaluated_filename,
                caption=caption
            )'''
          new_send = '''            bot.send_document(
                chat_id,
                final_pdf,
                visible_file_name=evaluated_filename,
                caption=caption,
                reply_markup=reply_markup
            )'''
          if old_send not in s:
              raise SystemExit('Could not locate evaluation send_document block')
          s = s.replace(old_send, new_send, 1)

          # 4) Callback buttons: show stored result or resend stored evaluated PDF.
          marker = '\n\n# ============================================================\n# PRANA PCS STUDENT MINI APP\n'
          callback_block = r'''

# ============================================================
# TELEGRAM RESULT / PDF BUTTONS
# ============================================================

if bot:
    @bot.callback_query_handler(func=lambda call: str(call.data or "").startswith("prana_result:"))
    def telegram_result_button(call):
        try:
            submission_id = str(call.data.split(":", 1)[1])
            s = SessionLocal()
            try:
                sub = s.get(DBSubmission, submission_id)
                if not sub or str(sub.telegram_user_id) != str(call.from_user.id):
                    bot.answer_callback_query(call.id, "Evaluation not found.", show_alert=True)
                    return
                pct = (float(sub.total_obtained_marks or 0) / float(sub.total_max_marks or 1) * 100) if sub.total_max_marks else 0
                text = (
                    f"📊 <b>PRANA PCS AI Evaluation</b>\n\n"
                    f"<b>Exam:</b> {sub.exam or 'UPPCS'}\n"
                    f"<b>Paper:</b> {sub.paper}\n"
                    f"<b>Type:</b> {sub.evaluation_type or 'GENERAL'}\n"
                    f"<b>Marks:</b> {float(sub.total_obtained_marks or 0):g} / {float(sub.total_max_marks or 0):g}\n"
                    f"<b>Percentage:</b> {pct:.1f}%\n\n"
                    f"{str(sub.overall_feedback or '').strip()}"
                )
            finally:
                s.close()
            bot.answer_callback_query(call.id)
            bot.send_message(call.message.chat.id, text[:4000])
        except Exception as e:
            print("TELEGRAM RESULT BUTTON ERROR:", e)
            bot.answer_callback_query(call.id, "Unable to load result.", show_alert=True)

    @bot.callback_query_handler(func=lambda call: str(call.data or "").startswith("prana_pdf:"))
    def telegram_pdf_button(call):
        try:
            submission_id = str(call.data.split(":", 1)[1])
            s = SessionLocal()
            try:
                sub = s.get(DBSubmission, submission_id)
                f = s.get(DBSubmissionPDF, submission_id)
                if not sub or str(sub.telegram_user_id) != str(call.from_user.id) or not f:
                    bot.answer_callback_query(call.id, "PDF not found.", show_alert=True)
                    return
                bio = io.BytesIO(bytes(f.pdf_bytes))
                bio.name = Path(sub.evaluated_filename).name
            finally:
                s.close()
            bot.answer_callback_query(call.id)
            bot.send_document(call.message.chat.id, bio, caption="📄 PRANA PCS AI Evaluated Copy")
        except Exception as e:
            print("TELEGRAM PDF BUTTON ERROR:", e)
            bot.answer_callback_query(call.id, "Unable to send PDF.", show_alert=True)
'''
          if marker not in s:
              raise SystemExit('Could not locate Mini App section marker')
          if 'prana_result:' not in s:
              s = s.replace(marker, callback_block + marker, 1)

          p.write_text(s, encoding='utf-8')
          print('Patched main.py in place; lines:', len(s.splitlines()))
          PY

      - name: Verify Python syntax
        run: python -m py_compile main.py

      - name: Commit patch and remove one-shot workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/prana-unified-access-patch.yml
          git add main.py
          git commit -m 'chore: apply unified access patch'
          git push
