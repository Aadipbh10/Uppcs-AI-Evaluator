name: Prana Final Stability Patch

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/prana-final-stability.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore and patch Mini App
        shell: python
        run: |
          from pathlib import Path
          import subprocess
          p=Path("static/branding/mini_app.html")
          p.parent.mkdir(parents=True,exist_ok=True)
          s=subprocess.check_output(["git","show","e90119a3d2b06ebaa728b2fd6b63b4f08e78c04b:static/branding/mini app.html"],text=True)
          s=s.replace("theme:(localStorage.getItem('prana_theme')||'dark')","theme:(localStorage.getItem('prana_theme')||'light')")
          old="async function api(path,opt={}){const r=await fetch(path,{credentials:'include',...opt});const d=await r.json().catch(()=>({}));if(!r.ok||d.ok===false)throw new Error(d.error||`Request failed (${r.status})`);return d}"
          new="async function api(path,opt={}){const headers=new Headers(opt.headers||{});if(tg&&tg.initData)headers.set('X-Telegram-Init-Data',tg.initData);const r=await fetch(path,{credentials:'include',...opt,headers});const d=await r.json().catch(()=>({}));if(!r.ok||d.ok===false)throw new Error(d.error||`Request failed (${r.status})`);return d}"
          if old not in s: raise SystemExit("Mini App api pattern not found")
          s=s.replace(old,new,1)
          marker="async function pollStatus(id){"
          submit="""function removeFile(i){state.files.splice(i,1);renderFiles()}
async function submitEvaluation(){
  if(!state.evaluationAccess)return toast(state.lang==='en'?'Evaluation access is not active.':'Evaluation access सक्रिय नहीं है।');
  if(!state.paper)return toast(state.lang==='en'?'Select a paper first.':'पहले पेपर चुनें।');
  if(!state.files.length)return toast(state.lang==='en'?'Upload your answer copy first.':'पहले उत्तर कॉपी अपलोड करें।');
  const total=state.files.reduce((n,f)=>n+f.size,0);
  if(total>20*1024*1024)return toast(state.lang==='en'?'Total copy size must be 20 MB or less.':'कुल कॉपी 20 MB या उससे कम होनी चाहिए।');
  if(state.evaluationType!=='GENERAL'&&state.evaluationType!=='OTHER'&&!state.sourceId)return toast(state.lang==='en'?'Select the uploaded question/content source.':'अपलोड किया गया प्रश्न/content source चुनें।');
  const btn=$('submitBtn');btn.disabled=true;btn.textContent=state.lang==='en'?'Uploading…':'अपलोड हो रहा है…';
  const fd=new FormData();state.files.forEach(f=>fd.append('files',f,f.name));
  const params=new URLSearchParams({paper:state.paper,exam:$('examSelect').value||'UPPCS',evaluation_type:state.evaluationType||'GENERAL'});
  if(state.sourceId)params.set('source_id',state.sourceId);
  try{const d=await api('/api/app/evaluate?'+params.toString(),{method:'POST',body:fd});state.submission=d.submission_id;go('processing');pollStatus(d.submission_id)}catch(e){toast(e.message||'Evaluation failed.');btn.disabled=false;btn.textContent=t('evaluate')}}
"""
          if marker not in s: raise SystemExit("Mini App submit marker not found")
          s=s.replace(marker,submit+marker,1)
          p.write_text(s,encoding="utf-8")

      - name: Patch backend stability and Gemini latency
        shell: python
        run: |
          from pathlib import Path
          p=Path("main.py")
          s=p.read_text(encoding="utf-8")
          old="MODELS = [\n    \"gemini-3.6-flash\",\n    \"gemini-3.7-flash\",\n    \"gemini-3.5-flash\",\n    \"gemini-3.5-flash-lite\",\n]"
          new="MODELS = [\n    \"gemini-3.6-flash\",\n    \"gemini-3.5-flash-lite\",\n]"
          if old not in s: raise SystemExit("MODELS block not found")
          s=s.replace(old,new,1)
          old="""engine = create_engine(
            DATABASE_URL,
            pool_pre_ping=True,
            pool_recycle=300,
            connect_args={"connect_timeout": 10},
        )"""
          new="""engine = create_engine(
            DATABASE_URL,
            pool_pre_ping=True,
            pool_recycle=300,
            pool_size=5,
            max_overflow=10,
            pool_timeout=15,
            connect_args={"connect_timeout": 10},
        )"""
          if old not in s: raise SystemExit("engine block not found")
          s=s.replace(old,new,1)
          old="""@app.post(\"/api/app/auth\")
async def app_auth(request: Request):
    body = await request.json()
    init_data = str(body.get(\"initData\", \"\"))"""
          new="""@app.post(\"/api/app/auth\")
async def app_auth(request: Request):
    try:
        body = await request.json()
    except Exception:
        body = {}
    init_data = str(body.get(\"initData\", \"\") or request.headers.get(\"X-Telegram-Init-Data\", \"\"))"""
          if old not in s: raise SystemExit("auth block not found")
          s=s.replace(old,new,1)
          old="""@app.post(\"/api/app/admin-auth\")
async def app_admin_auth(request: Request):
    body = await request.json()
    init_data = str(body.get(\"initData\", \"\"))"""
          new="""@app.post(\"/api/app/admin-auth\")
async def app_admin_auth(request: Request):
    try:
        body = await request.json()
    except Exception:
        body = {}
    init_data = str(body.get(\"initData\", \"\") or request.headers.get(\"X-Telegram-Init-Data\", \"\"))"""
          if old not in s: raise SystemExit("admin auth block not found")
          s=s.replace(old,new,1)
          old="""def app_user_payload(uid):
    session = SessionLocal()
    try:
        u = session.get(DBUser, str(uid))
        if not u:
            return None
        rows = session.query(DBSubmission).filter(
            DBSubmission.telegram_user_id == str(uid),
            DBSubmission.status == \"completed\"
        ).order_by(desc(DBSubmission.created_at)).all()
        obtained = sum(float(x.total_obtained_marks or 0) for x in rows)
        maximum = sum(float(x.total_max_marks or 0) for x in rows)"""
          new="""def app_user_payload(uid):
    if not DB_ENABLED or SessionLocal is None:
        return {\"id\":str(uid),\"name\":\"Student\",\"username\":None,\"submissions\":0,\"obtained\":0,\"max\":0,\"average_percentage\":0}
    session = SessionLocal()
    try:
        u = session.get(DBUser, str(uid))
        if not u:
            return None
        try:
            rows = session.query(DBSubmission).filter(
                DBSubmission.telegram_user_id == str(uid),
                DBSubmission.status == \"completed\"
            ).order_by(desc(DBSubmission.created_at)).limit(200).all()
        except Exception as exc:
            session.rollback()
            print(\"APP USER PAYLOAD SUBMISSIONS ERROR:\", exc)
            rows = []
        obtained = sum(float(x.total_obtained_marks or 0) for x in rows)
        maximum = sum(float(x.total_max_marks or 0) for x in rows)"""
          if old not in s: raise SystemExit("payload block not found")
          s=s.replace(old,new,1)
          old="""        \"generationConfig\": {
            \"response_mime_type\": \"application/json\",
            \"temperature\": 0.15
        }"""
          new="""        \"generationConfig\": {
            \"response_mime_type\": \"application/json\",
            \"thinkingConfig\": {\"thinkingLevel\": \"low\"},
            \"maxOutputTokens\": 24000
        }"""
          if old not in s: raise SystemExit("Gemini config block not found")
          s=s.replace(old,new,1)
          if "timeout=90" not in s: raise SystemExit("Gemini timeout not found")
          s=s.replace("timeout=90","timeout=(75,120)",1)
          s=s.replace("EVALUATION_STALE_SECONDS = 8 * 60","EVALUATION_STALE_SECONDS = 12 * 60",1)
          p.write_text(s,encoding="utf-8")

      - name: Verify
        run: |
          python -m py_compile main.py
          test -f static/branding/mini_app.html
          grep -q "function submitEvaluation" static/branding/mini_app.html
          grep -q "gemini-3.6-flash" main.py
          ! grep -q "gemini-3.7-flash" main.py

      - name: Commit and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main.py static/branding/mini_app.html
          git rm .github/workflows/prana-final-stability.yml
          git commit -m "fix: stabilize mini app auth and speed up evaluation"
          git push
